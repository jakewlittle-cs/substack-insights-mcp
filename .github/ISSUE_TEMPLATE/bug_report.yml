name: Bug report
description: Report a reproducible problem that is not security-sensitive.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use the private Security reporting flow instead.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: node
    attributes:
      label: Node.js version
      options: ["22", "24", "Other"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal steps and sanitized inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
