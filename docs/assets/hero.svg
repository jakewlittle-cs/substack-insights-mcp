<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Substack Insights MCP</title>
  <desc id="desc">A credential-free local content ledger and analytics engine for Substack publications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6719"/>
      <stop offset="0.52" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="26" fill="url(#grid)"/>
  <circle cx="1040" cy="40" r="270" fill="url(#glow)"/>
  <circle cx="150" cy="430" r="230" fill="url(#glow)" opacity=".65"/>

  <g transform="translate(489 48)">
    <rect width="222" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="20" cy="18" r="5" fill="#ff6719"/>
    <text x="36" y="23" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.2">MCP · RSS · SQLITE</text>
  </g>

  <text x="600" y="156" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.4">Substack Insights</text>
  <rect x="250" y="174" width="700" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="600" y="231" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Your publication's memory—local, exact, queryable.</text>
  <text x="600" y="274" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Immutable content history · metric snapshots · deterministic analytics</text>

  <g transform="translate(345 324)">
    <rect width="150" height="44" rx="12" fill="#ff6719"/>
    <text x="75" y="28" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">12 MCP tools</text>
    <rect x="165" width="180" height="44" rx="12" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="255" y="28" text-anchor="middle" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Zero credentials</text>
    <rect x="360" width="150" height="44" rx="12" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="435" y="28" text-anchor="middle" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Apache 2.0</text>
  </g>
</svg>
