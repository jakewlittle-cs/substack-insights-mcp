<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Substack Insights MCP</title>
  <desc id="desc">Your publication's memory—local, exact, and queryable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6719"/>
      <stop offset="0.52" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1100" cy="60" r="340" fill="url(#glow)"/>
  <circle cx="120" cy="610" r="280" fill="url(#glow)" opacity=".7"/>

  <g transform="translate(529 86)">
    <rect width="222" height="38" rx="19" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="20" cy="19" r="5" fill="#ff6719"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.2">MCP · RSS · SQLITE</text>
  </g>

  <text x="640" y="250" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="760" letter-spacing="-3">Substack Insights</text>
  <rect x="235" y="278" width="810" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="640" y="356" text-anchor="middle" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30">Your publication's memory—local, exact, queryable.</text>
  <text x="640" y="408" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Immutable content history · metric snapshots · deterministic analytics</text>

  <g transform="translate(365 472)">
    <rect width="160" height="48" rx="13" fill="#ff6719"/>
    <text x="80" y="30" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700">12 MCP tools</text>
    <rect x="180" width="190" height="48" rx="13" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="275" y="30" text-anchor="middle" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Zero credentials</text>
    <rect x="390" width="160" height="48" rx="13" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="470" y="30" text-anchor="middle" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Apache 2.0</text>
  </g>

  <text x="640" y="590" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">github.com/jakewlittle-cs/substack-insights-mcp</text>
</svg>
